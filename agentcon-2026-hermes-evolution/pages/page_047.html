

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>讨论问题</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg-deep: #0F1E33;
  --bg-deep-2: #0A1626;
  --ink: #F5F0E8;
  --ink-muted: rgba(245, 240, 232, 0.55);
  --ink-faint: rgba(245, 240, 232, 0.32);
  --gold: #B4A078;
  --gold-soft: rgba(180, 160, 120, 0.55);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  background: #0A1626;
}

body {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 1200px 800px at 20% 10%, rgba(30, 55, 90, 0.35) 0%, rgba(15, 30, 51, 0) 60%),
    radial-gradient(ellipse 1000px 700px at 85% 90%, rgba(180, 160, 120, 0.06) 0%, rgba(15, 30, 51, 0) 65%),
    linear-gradient(180deg, #0F1E33 0%, #0C1A2D 100%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 72px 100px;
  display: flex;
  flex-direction: column;
}

/* 装饰几何元素 */
.deco-square {
  position: absolute;
  width: 12px;
  height: 12px;
  background: var(--gold);
}
.deco-square.tr { top: 72px; right: 100px; }
.deco-circle {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px solid var(--gold-soft);
  background: transparent;
}
.deco-circle.bl { bottom: 76px; left: 100px; }
.deco-line-v {
  position: absolute;
  top: 200px;
  right: 100px;
  width: 1px;
  height: 60px;
  background: var(--gold-soft);
}

/* 顶部标题区 */
.header {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 40px;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: "JetBrains Mono", "Noto Sans SC", monospace;
  font-size: 12px;
  color: var(--gold);
  letter-spacing: 3px;
  text-transform: uppercase;
}

.eyebrow .dot {
  width: 6px;
  height: 6px;
  background: var(--gold);
  border-radius: 50%;
}

.title {
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
  font-size: 84px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 8px;
  line-height: 1;
}

.subtitle {
  font-family: "Noto Sans SC", sans-serif;
  font-size: 20px;
  font-weight: 300;
  color: rgba(245, 240, 232, 0.72);
  letter-spacing: 4px;
  margin-top: 6px;
}

.subtitle .accent {
  color: var(--gold);
  font-weight: 400;
}

/* 分隔细线 */
.divider-top {
  width: 88px;
  height: 1px;
  background: var(--gold);
  margin-top: 20px;
  margin-bottom: 8px;
}

/* 问题区 */
.questions {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 44px;
  margin-top: 10px;
}

.q {
  display: grid;
  grid-template-columns: 34px 140px 1fr;
  align-items: baseline;
  column-gap: 28px;
  max-width: 1240px;
}

.q:nth-child(1) { margin-left: 0; }
.q:nth-child(2) { margin-left: 80px; }
.q:nth-child(3) { margin-left: 160px; }

.q-anchor {
  width: 12px;
  height: 12px;
  background: var(--gold);
  align-self: center;
  transform: translateY(2px);
}

.q:nth-child(2) .q-anchor {
  border-radius: 50%;
  background: transparent;
  border: 1.5px solid var(--gold);
  width: 14px;
  height: 14px;
}

.q:nth-child(3) .q-anchor {
  background: var(--gold);
  width: 14px;
  height: 14px;
  transform: rotate(45deg) translateY(2px);
}

.q-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  color: var(--gold);
  letter-spacing: 2px;
  white-space: nowrap;
  align-self: center;
  padding-top: 4px;
}

.q-text {
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 32px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1.55;
  letter-spacing: 1.5px;
}

.q-text .em {
  color: var(--gold);
  font-weight: 500;
}

/* 底部分隔 + 田野考察 */
.footer {
  margin-top: auto;
  padding-top: 22px;
}

.footer-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}

.footer-divider .line {
  flex: 1;
  height: 1px;
  background: rgba(245, 240, 232, 0.18);
}

.footer-divider .sq {
  width: 6px;
  height: 6px;
  background: var(--gold-soft);
}

.invite {
  display: flex;
  align-items: baseline;
  gap: 20px;
  font-family: "Noto Sans SC", sans-serif;
  font-size: 16px;
  font-weight: 300;
  color: var(--ink-muted);
  letter-spacing: 2px;
}

.invite .tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--gold-soft);
  letter-spacing: 2px;
}

.invite .body {
  color: rgba(245, 240, 232, 0.55);
}

.invite .body .code {
  font-family: "JetBrains Mono", monospace;
  color: var(--gold);
  padding: 0 2px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="deco-square tr"></div>
    <div class="deco-line-v"></div>
    <div class="deco-circle bl"></div>
  </div>

  <div id="ct">
    <div class="header">
      <div class="eyebrow"><span class="dot"></span><span>Q &amp; A · 讨论环节</span></div>
      <div class="title">讨论问题</div>
      <div class="subtitle">留给 Q&amp;A 的<span class="accent">三个开放问题</span></div>
      <div class="divider-top"></div>
    </div>

    <div class="questions">
      <div class="q">
        <div class="q-anchor"></div>
        <div class="q-label">问题 #1</div>
        <div class="q-text">从<span class="em">"能用"</span>到<span class="em">"会协作"</span>，是否还有第五阶段？</div>
      </div>

      <div class="q">
        <div class="q-anchor"></div>
        <div class="q-label">问题 #2</div>
        <div class="q-text">开源 Agent 的<span class="em">"度量权"</span>应在社区还是标准化？</div>
      </div>

      <div class="q">
        <div class="q-anchor"></div>
        <div class="q-label">问题 #3</div>
        <div class="q-text">中国<span class="em">"行政开源"</span>的 slow-moving 层会演化出新形态？</div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-divider">
        <div class="sq"></div>
        <div class="line"></div>
      </div>
      <div class="invite">
        <span class="tag">田野考察 · FIELD NOTE</span>
        <span class="body">欢迎补充案例 —— <span class="code">issue</span> / <span class="code">PR</span> / <span class="code">release</span> 都是田野材料</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
