

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Thank you · 开源之道 · AgentCon 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

:root {
  --bg-deep: #0F1E33;
  --primary: #1B3B6B;
  --warm-white: #F5F0E8;
  --gold: #B4A078;
  --warm-white-dim: rgba(245, 240, 232, 0.62);
  --gold-dim: rgba(180, 160, 120, 0.55);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--warm-white);
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: var(--bg-deep);
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: radial-gradient(ellipse 90% 65% at 50% 50%, #1B3B6B 0%, #0F1E33 65%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px;
  box-sizing: border-box;
}

/* ===== 顶栏装饰 ===== */
.top-bar {
  position: absolute;
  top: 40px;
  left: 60px;
  right: 60px;
  height: 1px;
  background: var(--gold-dim);
}

.top-corner-l,
.top-corner-r {
  position: absolute;
  width: 6px;
  height: 6px;
  background: var(--gold);
  top: 37px;
}
.top-corner-l { left: 40px; }
.top-corner-r { right: 40px; }

.top-diamond {
  position: absolute;
  top: 72px;
  left: 50%;
  transform: translateX(-50%) rotate(45deg);
  width: 10px;
  height: 10px;
  background: var(--gold);
}

.side-line-l {
  position: absolute;
  top: 80px;
  left: 60px;
  width: 140px;
  height: 1px;
  background: var(--gold-dim);
}
.side-line-r {
  position: absolute;
  top: 80px;
  right: 60px;
  width: 140px;
  height: 1px;
  background: var(--gold-dim);
}

/* ===== 元信息 ===== */
.meta-row {
  position: absolute;
  top: 108px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 22px;
  font-family: "Noto Sans SC", "PingFang SC", sans-serif;
  font-size: 15px;
  letter-spacing: 0.14em;
  color: var(--warm-white-dim);
  font-weight: 400;
}

.meta-row .sep {
  color: var(--gold);
  font-size: 14px;
  opacity: 0.85;
}

.meta-row .eng {
  font-style: italic;
  letter-spacing: 0.05em;
  color: rgba(245, 240, 232, 0.72);
}

.meta-row .dot {
  color: var(--gold);
  padding: 0 10px;
}

/* ===== 主标题块 ===== */
.thank-you-block {
  position: absolute;
  top: 195px;
  left: 0;
  right: 0;
  text-align: center;
}

.gold-line {
  display: inline-block;
  width: 110px;
  height: 1px;
  background: var(--gold);
  margin-bottom: 34px;
}

.thank-you {
  font-family: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
  font-size: 176px;
  font-weight: 500;
  color: var(--warm-white);
  letter-spacing: 0.05em;
  line-height: 1;
  margin-bottom: 38px;
}

.subtitle {
  font-family: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
  font-size: 26px;
  color: var(--warm-white);
  letter-spacing: 0.14em;
  opacity: 0.86;
  font-weight: 400;
}

.bottom-decor {
  margin-top: 46px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

.bline {
  display: inline-block;
  width: 46px;
  height: 1px;
  background: var(--gold-dim);
}

.bdot {
  display: inline-block;
  width: 5px;
  height: 5px;
  background: var(--gold);
  border-radius: 50%;
}

/* ===== 底部金句 ===== */
.quote {
  position: absolute;
  bottom: 70px;
  right: 60px;
  font-family: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
  font-style: italic;
  font-size: 18px;
  color: var(--warm-white);
  opacity: 0.82;
  letter-spacing: 0.03em;
  line-height: 1.7;
  text-align: right;
  max-width: 720px;
}

/* ===== 底部几何标记 ===== */
.bottom-bar {
  position: absolute;
  bottom: 30px;
  left: 60px;
  width: 60px;
  height: 1px;
  background: var(--gold);
}

.hermes {
  position: absolute;
  bottom: 30px;
  right: 60px;
  width: 1px;
  height: 60px;
  background: var(--gold);
}

.hermes::before {
  content: "";
  position: absolute;
  top: 26px;
  left: -2px;
  width: 5px;
  height: 5px;
  background: var(--gold);
  transform: rotate(45deg);
}

.hermes::after {
  content: "";
  position: absolute;
  top: -3px;
  left: -2px;
  width: 5px;
  height: 5px;
  background: var(--gold);
  transform: rotate(45deg);
}

/* ===== 侧边点缀 ===== */
.side-dot-l {
  position: absolute;
  top: 480px;
  left: 40px;
  width: 6px;
  height: 6px;
  background: var(--gold);
  border-radius: 50%;
  opacity: 0.85;
}

.side-dot-r {
  position: absolute;
  top: 480px;
  right: 40px;
  width: 6px;
  height: 6px;
  background: var(--gold);
  border-radius: 50%;
  opacity: 0.85;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">
    <!-- 顶部装饰 -->
    <div class="top-bar"></div>
    <div class="top-corner-l"></div>
    <div class="top-corner-r"></div>
    <div class="top-diamond"></div>
    <div class="side-line-l"></div>
    <div class="side-line-r"></div>

    <!-- 元信息 -->
    <div class="meta-row">
      <span>「开源之道」· 适兕 × 窄廊</span>
      <span class="sep">·</span>
      <span class="eng">Open Source Way · Kuosi × Narrow Corridor</span>
      <span class="sep">·</span>
      <span>Token 经济趋势 · AgentCon 2026 北京站</span>
      <span class="dot">·</span>
      <span>2026-09-11</span>
    </div>

    <!-- 主标题块 -->
    <div class="thank-you-block">
      <div class="gold-line"></div>
      <h1 class="thank-you">Thank you</h1>
      <div class="subtitle">「开源之道」· 适兕 × 窄廊 · AgentCon 2026 · 北京</div>
      <div class="bottom-decor">
        <span class="bline"></span>
        <span class="bdot"></span>
        <span class="bline"></span>
      </div>
    </div>

    <!-- 底部金句 -->
    <div class="quote">「感谢聆听。Keep Movement —— 知识不是静止的，是在移动中产生的。」</div>

    <!-- 侧边圆点 -->
    <div class="side-dot-l"></div>
    <div class="side-dot-r"></div>

    <!-- 底部几何标记 -->
    <div class="bottom-bar"></div>
    <div class="hermes"></div>
  </div>
</div>
</body>
</html>
