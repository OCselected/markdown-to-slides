

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第二幕 · Hermes 技术架构</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap');

:root {
  --bg-1: #0F172A;
  --bg-2: #1E293B;
  --cyan: #00BCD4;
  --cyan-dim: rgba(0, 188, 212, 0.32);
  --cyan-glow: rgba(0, 188, 212, 0.55);
  --orange: #FF7043;
  --text-hi: #F8FAFC;
  --text-mid: #94A3B8;
  --text-lo: #64748B;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  background: #0F172A;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--text-hi);
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: var(--bg-1);
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
}

#bg .grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0, 188, 212, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 188, 212, 0.045) 1px, transparent 1px);
  background-size: 80px 80px;
}

#bg .glow-a {
  position: absolute;
  top: -180px;
  left: -160px;
  width: 720px;
  height: 720px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 188, 212, 0.22) 0%, transparent 70%);
  filter: blur(20px);
}

#bg .glow-b {
  position: absolute;
  bottom: -220px;
  right: -220px;
  width: 820px;
  height: 820px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 188, 212, 0.14) 0%, transparent 70%);
  filter: blur(20px);
}

#bg .glow-c {
  position: absolute;
  top: 45%;
  left: 48%;
  width: 520px;
  height: 520px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 188, 212, 0.18) 0%, transparent 65%);
  filter: blur(30px);
}

#bg .vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(15, 23, 42, 0.55) 100%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px;
}

.chapter-badge {
  position: absolute;
  top: 60px;
  left: 60px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.chapter-badge .bar {
  width: 48px;
  height: 2px;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan-glow);
}

.chapter-badge .num {
  font-size: 14px;
  font-weight: 600;
  color: var(--cyan);
  letter-spacing: 0.35em;
}

.chapter-tag-right {
  position: absolute;
  top: 60px;
  right: 60px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.chapter-tag-right .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan-glow);
}

.chapter-tag-right .txt {
  font-size: 13px;
  color: var(--text-lo);
  letter-spacing: 0.32em;
  font-weight: 500;
}

.header {
  position: absolute;
  top: 205px;
  left: 0;
  right: 0;
  text-align: center;
  padding: 0 60px;
}

.eyebrow {
  font-size: 13px;
  letter-spacing: 0.55em;
  color: var(--text-lo);
  font-weight: 500;
  margin-bottom: 30px;
}

.main-title {
  font-size: 96px;
  font-weight: 800;
  line-height: 1.12;
  letter-spacing: -0.015em;
  margin: 0 0 26px 0;
  color: var(--text-hi);
}

.main-title .dot-sep {
  color: var(--cyan);
  margin: 0 0.2em;
  font-weight: 700;
}

.main-title .en {
  background: linear-gradient(180deg, #FFFFFF 0%, #00BCD4 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-left: 0.15em;
  letter-spacing: -0.005em;
}

.subtitle {
  font-size: 22px;
  font-weight: 300;
  letter-spacing: 0.16em;
  color: var(--text-mid);
  margin: 0;
}

.divider {
  position: absolute;
  top: 545px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 14px;
}

.divider .h-line {
  width: 90px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan-dim));
}

.divider .h-line.right {
  background: linear-gradient(90deg, var(--cyan-dim), transparent);
}

.divider .h-dot {
  width: 6px;
  height: 6px;
  background: var(--cyan);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--cyan-glow);
}

.lines-container {
  position: absolute;
  top: 315px;
  left: 0;
  right: 0;
  pointer-events: none;
}

.v-line {
  position: absolute;
  top: 0;
  height: 260px;
  width: 2px;
  background: linear-gradient(180deg,
    transparent 0%,
    var(--cyan) 22%,
    var(--cyan) 78%,
    transparent 100%);
  box-shadow: 0 0 14px rgba(0, 188, 212, 0.6);
}

.v-line.left { left: 460px; }
.v-line.right { left: 1138px; }

.v-line::before,
.v-line::after {
  content: '';
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 14px var(--cyan-glow);
}

.v-line::before { top: -4px; }
.v-line::after { bottom: -4px; }

.invariant-label {
  position: absolute;
  top: -26px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  letter-spacing: 0.4em;
  color: var(--cyan);
  font-weight: 600;
  opacity: 0.85;
}

.bullets {
  position: absolute;
  bottom: 135px;
  left: 60px;
  right: 60px;
  display: flex;
  justify-content: center;
  gap: 90px;
}

.bullet {
  display: flex;
  align-items: center;
  gap: 16px;
  max-width: 520px;
}

.bullet .prefix {
  width: 14px;
  height: 14px;
  background: var(--cyan);
  flex-shrink: 0;
  box-shadow: 0 0 10px var(--cyan-glow);
}

.bullet.orange .prefix {
  background: var(--orange);
  box-shadow: 0 0 10px rgba(255, 112, 67, 0.5);
}

.bullet .txt {
  font-size: 18px;
  color: #CBD5E1;
  letter-spacing: 0.05em;
  line-height: 1.5;
}

.bullet .txt .label {
  color: var(--cyan);
  font-weight: 700;
  margin-right: 10px;
  letter-spacing: 0.15em;
}

.bullet.orange .txt .label {
  color: var(--orange);
}

.footer {
  position: absolute;
  bottom: 55px;
  left: 60px;
  right: 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  letter-spacing: 0.4em;
  color: var(--text-lo);
  font-weight: 500;
}

.footer .center-dot {
  color: var(--cyan);
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="grid"></div>
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <div class="glow-c"></div>
    <div class="vignette"></div>
  </div>
  <div id="ct">
    <div class="chapter-badge">
      <span class="bar"></span>
      <span class="num">CHAPTER 02</span>
    </div>

    <div class="chapter-tag-right">
      <span class="txt">HERMES · ACT II</span>
      <span class="dot"></span>
    </div>

    <div class="header">
      <div class="eyebrow">ARCHITECTURE · CHAPTER TRANSITION</div>
      <h1 class="main-title">
        <span>第二幕</span><span class="dot-sep">·</span><span class="en">Hermes 技术架构</span>
      </h1>
      <p class="subtitle">两条不变量决定了所有设计决策</p>
    </div>

    <div class="divider">
      <span class="h-line"></span>
      <span class="h-dot"></span>
      <span class="h-line right"></span>
    </div>

    <div class="lines-container">
      <div class="v-line left">
        <span class="invariant-label">I</span>
      </div>
      <div class="v-line right">
        <span class="invariant-label">II</span>
      </div>
    </div>

    <div class="bullets">
      <div class="bullet">
        <span class="prefix"></span>
        <span class="txt"><span class="label">目标</span>先讲不变量，再讲架构，最后讲独特性</span>
      </div>
      <div class="bullet orange">
        <span class="prefix"></span>
        <span class="txt"><span class="label">方法</span>从设计原则推导出能力落地路径</span>
      </div>
    </div>

    <div class="footer">
      <span><span class="center-dot">▎</span> HERMES / ARCHITECTURE</span>
      <span>ACT II · 02</span>
    </div>
  </div>
</div>
</body>
</html>
