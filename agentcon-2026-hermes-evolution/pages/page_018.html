

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>三个核心洞察</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
  :root {
    --primary: #00BCD4;
    --primary-glow: rgba(0, 188, 212, 0.5);
    --accent: #FF7043;
    --bg-1: #0A1220;
    --bg-2: #1E293B;
    --bg-3: #0D1B2A;
    --text-main: #E2E8F0;
    --text-muted: #94A3B8;
    --border: rgba(0, 188, 212, 0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: var(--text-main);
    background: var(--bg-1);
    -webkit-font-smoothing: antialiased;
  }
  .wrapper {
    width: 1600px; height: 900px;
    position: relative; overflow: hidden;
    margin: 0 auto;
    background: linear-gradient(135deg, #0A1220 0%, #1E293B 55%, #0D1B2A 100%);
  }
  #bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  #ct { position: absolute; inset: 0; z-index: 1; padding: 62px 88px; }

  .grid-overlay {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0, 188, 212, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 188, 212, 0.045) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .glow-a {
    position: absolute; width: 720px; height: 720px;
    border-radius: 50%;
    top: -280px; right: -180px;
    background: radial-gradient(circle, rgba(0, 188, 212, 0.22) 0%, rgba(0, 188, 212, 0) 62%);
    filter: blur(8px);
  }
  .glow-b {
    position: absolute; width: 620px; height: 620px;
    border-radius: 50%;
    bottom: -260px; left: -180px;
    background: radial-gradient(circle, rgba(255, 112, 67, 0.13) 0%, rgba(255, 112, 67, 0) 62%);
  }
  .corner-tl {
    position: absolute; top: 34px; left: 34px;
    width: 44px; height: 44px;
    border-top: 1.5px solid var(--primary);
    border-left: 1.5px solid var(--primary);
    opacity: 0.75;
  }
  .corner-br {
    position: absolute; bottom: 34px; right: 34px;
    width: 44px; height: 44px;
    border-bottom: 1.5px solid var(--primary);
    border-right: 1.5px solid var(--primary);
    opacity: 0.75;
  }
  .float-dot {
    position: absolute; width: 6px; height: 6px;
    background: var(--primary); border-radius: 50%;
    box-shadow: 0 0 10px var(--primary);
  }
  .dot-1 { top: 240px; right: 160px; }
  .dot-2 { bottom: 260px; left: 118px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .dot-3 { top: 580px; right: 90px; opacity: 0.55; }

  .header { margin-bottom: 38px; }
  .header-meta {
    display: flex; align-items: center; gap: 14px;
    font-size: 12px; letter-spacing: 4.5px;
    color: var(--primary);
    margin-bottom: 18px;
    text-transform: uppercase;
  }
  .header-meta .meta-line {
    display: inline-block; width: 52px; height: 1px;
    background: linear-gradient(90deg, var(--primary), transparent);
  }
  .header h1 {
    font-size: 62px; font-weight: 800;
    letter-spacing: 2px;
    color: var(--text-main);
    line-height: 1.1;
    display: flex; align-items: center; gap: 26px;
  }
  .header h1 .accent-bar {
    display: inline-block; width: 8px; height: 54px;
    background: linear-gradient(180deg, var(--primary), var(--accent));
    border-radius: 4px;
    box-shadow: 0 0 22px var(--primary-glow);
  }
  .header-line {
    display: flex; align-items: center; gap: 14px;
    margin-top: 26px;
  }
  .header-line .hl {
    flex: 0 0 220px; height: 2px;
    background: linear-gradient(90deg, var(--primary), rgba(0, 188, 212, 0));
    position: relative;
  }
  .header-line .hl::after {
    content: ''; position: absolute;
    right: 0; top: -3px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 12px var(--primary);
  }
  .header-line .tag {
    font-size: 12px; letter-spacing: 4px;
    color: var(--text-muted);
    padding: 5px 14px;
    border: 1px solid rgba(148, 163, 184, 0.28);
    border-radius: 2px;
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 26px;
    margin-bottom: 32px;
  }
  .card {
    position: relative;
    background: linear-gradient(160deg, rgba(0, 188, 212, 0.06), rgba(30, 41, 59, 0.55));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px 26px 26px;
    height: 410px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    box-shadow: 0 0 14px var(--primary-glow);
  }
  .card::after {
    content: ''; position: absolute;
    top: 60px; right: -50px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(0, 188, 212, 0.14) 0%, rgba(0, 188, 212, 0) 65%);
    pointer-events: none;
  }
  .card-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 18px;
    position: relative; z-index: 2;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 14px 6px 10px;
    background: rgba(0, 188, 212, 0.11);
    border: 1px solid rgba(0, 188, 212, 0.45);
    border-radius: 999px;
    font-size: 11px; letter-spacing: 3px;
    color: var(--primary);
  }
  .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 8px var(--primary);
  }
  .card-num {
    position: relative;
    font-size: 84px; font-weight: 900;
    line-height: 0.9;
    color: transparent;
    -webkit-text-stroke: 1.2px var(--primary);
    letter-spacing: -2px;
    padding-right: 2px;
  }
  .card-num::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 120px; height: 80px;
    background: radial-gradient(ellipse, rgba(0, 188, 212, 0.28) 0%, rgba(0, 188, 212, 0) 60%);
    z-index: -1;
    filter: blur(4px);
  }
  .card-title {
    font-size: 26px; font-weight: 700;
    color: var(--text-main);
    line-height: 1.25;
    margin-bottom: 18px;
    letter-spacing: 1px;
    position: relative; z-index: 2;
  }
  .card-divider {
    width: 44px; height: 2px;
    background: linear-gradient(90deg, var(--primary), transparent);
    margin-bottom: 16px;
    position: relative; z-index: 2;
  }
  .card-body {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text-muted);
    position: relative; z-index: 2;
  }
  .card-body .highlight {
    color: var(--primary);
    font-weight: 700;
  }
  .card-body .warn {
    color: var(--accent);
    font-weight: 700;
  }
  .card-body .quote {
    display: block;
    font-size: 12px;
    color: var(--primary);
    letter-spacing: 2.5px;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .card-footer {
    margin-top: auto;
    padding-top: 18px;
    border-top: 1px dashed rgba(148, 163, 184, 0.18);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10px; letter-spacing: 3.5px;
    color: rgba(148, 163, 184, 0.55);
    position: relative; z-index: 2;
  }
  .card-footer .arrow {
    color: var(--primary);
    font-size: 14px;
  }

  .card-2 .card-num { -webkit-text-stroke-color: var(--accent); }
  .card-2 .card-num::after { background: radial-gradient(ellipse, rgba(255, 112, 67, 0.22) 0%, rgba(255, 112, 67, 0) 60%); }
  .card-2 .card-divider { background: linear-gradient(90deg, var(--accent), transparent); }
  .card-2 .card-footer .arrow { color: var(--accent); }
  .card-2::before { background: linear-gradient(90deg, var(--accent), var(--primary)); }

  .card-3 .card-num { -webkit-text-stroke-color: var(--primary); }

  .summary {
    display: flex; align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px 40px;
    background: linear-gradient(90deg,
      rgba(0, 188, 212, 0) 0%,
      rgba(0, 188, 212, 0.10) 50%,
      rgba(0, 188, 212, 0) 100%);
    border-top: 1px solid rgba(0, 188, 212, 0.32);
    border-bottom: 1px solid rgba(0, 188, 212, 0.32);
    border-radius: 4px;
    position: relative;
  }
  .summary-mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255, 112, 67, 0.18);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 16px; font-weight: 900;
    box-shadow: 0 0 14px rgba(255, 112, 67, 0.45);
  }
  .summary-text {
    font-size: 17px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    font-weight: 500;
  }
  .summary-text .k {
    color: var(--primary);
    font-weight: 700;
  }
  .summary-text .k2 {
    color: var(--accent);
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="grid-overlay"></div>
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <div class="corner-tl"></div>
    <div class="corner-br"></div>
    <div class="float-dot dot-1"></div>
    <div class="float-dot dot-2"></div>
    <div class="float-dot dot-3"></div>
  </div>
  <div id="ct">

    <div class="header">
      <div class="header-meta">
        <span class="meta-line"></span>
        <span>核心结论 · KEY INSIGHTS</span>
      </div>
      <h1>
        <span class="accent-bar"></span>
        <span>三个核心洞察</span>
      </h1>
      <div class="header-line">
        <span class="hl"></span>
        <span class="tag">CONCLUSION</span>
      </div>
    </div>

    <div class="cards">
      <div class="card card-1">
        <div class="card-top">
          <span class="badge"><span class="dot"></span><span>洞察</span></span>
          <div class="card-num"><span>01</span></div>
        </div>
        <h3 class="card-title"><span>进入稳定化期</span></h3>
        <div class="card-divider"></div>
        <div class="card-body">
          <span class="quote">— 生命周期判断</span>
          从扩张期进入<span class="highlight">稳定化期</span>：<br>
          P2 全给 bug + P1 缺席 + <span class="warn">CLI 层 bug</span> 驱动。
        </div>
        <div class="card-footer">
          <span>PHASE</span>
          <span class="arrow">▸</span>
        </div>
      </div>

      <div class="card card-2">
        <div class="card-top">
          <span class="badge"><span class="dot"></span><span>洞察</span></span>
          <div class="card-num"><span>02</span></div>
        </div>
        <h3 class="card-title"><span>兼容性是结构性税</span></h3>
        <div class="card-divider"></div>
        <div class="card-body">
          <span class="quote">— 供给侧成本</span>
          <span class="warn">56%</span> PR 带兼容性标签——<br>
          供给侧的<span class="highlight">隐形成本</span>。
        </div>
        <div class="card-footer">
          <span>COST</span>
          <span class="arrow">▸</span>
        </div>
      </div>

      <div class="card card-3">
        <div class="card-top">
          <span class="badge"><span class="dot"></span><span>洞察</span></span>
          <div class="card-num"><span>03</span></div>
        </div>
        <h3 class="card-title"><span>消费侧信任是可观察信号</span></h3>
        <div class="card-divider"></div>
        <div class="card-body">
          <span class="quote">— 消费侧反馈</span>
          feature issue 自带<br>
          <span class="highlight">安全边界标签</span>。
        </div>
        <div class="card-footer">
          <span>TRUST</span>
          <span class="arrow">▸</span>
        </div>
      </div>
    </div>

    <div class="summary">
      <span class="summary-mark"><span>★</span></span>
      <span class="summary-text">从<span class="k">「能用」</span>到<span class="k2">「好用」</span>的关键跃迁就在<span class="k2">第三个洞察</span>里</span>
    </div>

  </div>
</div>
</body>
</html>
