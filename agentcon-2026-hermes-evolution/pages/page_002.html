

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>引子：从 Talk &amp; Search 到 Agent &amp; Decide</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;700&display=swap');

:root {
  --bg-deep: #0F1E33;
  --bg-primary: #1B3B6B;
  --accent-gold: #B4A078;
  --text-main: #F5F0E8;
  --text-secondary: rgba(245, 240, 232, 0.68);
  --border-gold: rgba(180, 160, 120, 0.3);
  --card-bg: rgba(27, 59, 107, 0.22);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg-deep);
  color: var(--text-main);
  font-family: 'Noto Sans SC', 'Source Han Sans SC', sans-serif;
  font-size: 18px;
  line-height: 1.6;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--bg-deep);
}

#bg::before {
  content: '';
  position: absolute;
  top: -120px;
  right: -120px;
  width: 440px;
  height: 440px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(180, 160, 120, 0.13) 0%, transparent 70%);
}

#bg::after {
  content: '';
  position: absolute;
  bottom: -120px;
  left: -120px;
  width: 440px;
  height: 440px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(27, 59, 107, 0.55) 0%, transparent 70%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* Hook row */
.hook-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 26px;
  margin-bottom: 22px;
}

.hook-line {
  width: 110px;
  height: 1px;
  background: var(--accent-gold);
  opacity: 0.55;
}

.hook {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
  font-size: 25px;
  font-style: italic;
  color: var(--accent-gold);
  letter-spacing: 1px;
  white-space: nowrap;
}

/* Title */
.title-block {
  text-align: center;
  margin-bottom: 30px;
}

.title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
  font-size: 40px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 18px;
  color: var(--text-secondary);
  letter-spacing: 8px;
  position: relative;
  display: inline-block;
}

.subtitle::before,
.subtitle::after {
  content: '·';
  position: absolute;
  color: var(--accent-gold);
  font-size: 26px;
  top: 50%;
  transform: translateY(-50%);
}

.subtitle::before { left: -30px; }
.subtitle::after { right: -30px; }

/* Columns */
.columns {
  display: flex;
  gap: 22px;
  flex: 1;
  margin-bottom: 24px;
}

.col {
  flex: 1;
  padding: 24px 28px 22px;
  background: var(--card-bg);
  border: 1px solid var(--border-gold);
  position: relative;
  display: flex;
  flex-direction: column;
}

.col-left,
.col-right {
  border-top: 3px solid var(--accent-gold);
}

.col-middle {
  flex: 0 0 170px;
  background: transparent;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.era-tag {
  font-size: 13px;
  letter-spacing: 4px;
  color: var(--accent-gold);
  margin-bottom: 10px;
  font-weight: 500;
}

.era-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.era-chinese {
  font-size: 20px;
  color: var(--text-secondary);
  letter-spacing: 4px;
  margin-bottom: 18px;
}

.visual {
  flex: 1;
  position: relative;
  min-height: 190px;
  margin-bottom: 18px;
}

/* Talk circles */
.bubble {
  position: absolute;
  border-radius: 50%;
}

.bubble-lg {
  width: 130px;
  height: 130px;
  border: 2px solid var(--accent-gold);
  left: 30px;
  top: 12px;
}

.bubble-md {
  width: 82px;
  height: 82px;
  background: var(--accent-gold);
  opacity: 0.75;
  right: 38px;
  top: 8px;
}

.bubble-sm {
  width: 52px;
  height: 52px;
  border: 2px solid var(--text-main);
  left: 140px;
  bottom: 10px;
}

.speech-dots {
  position: absolute;
  left: 82px;
  top: 70px;
  display: flex;
  gap: 7px;
}

.speech-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-gold);
}

/* Agent squares */
.block {
  position: absolute;
}

.block-lg {
  width: 105px;
  height: 105px;
  background: var(--accent-gold);
  left: 35px;
  top: 18px;
  opacity: 0.85;
}

.block-md {
  width: 78px;
  height: 78px;
  border: 2px solid var(--text-main);
  right: 42px;
  top: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.block-sm {
  width: 52px;
  height: 52px;
  background: var(--bg-primary);
  border: 2px solid var(--accent-gold);
  right: 85px;
  bottom: 12px;
}

.checkmark {
  font-size: 30px;
  color: var(--accent-gold);
  font-weight: 700;
  line-height: 1;
}

/* Middle fork */
.fork-line-top,
.fork-line-bottom {
  width: 1px;
  flex: 1;
  background: var(--accent-gold);
  opacity: 0.22;
}

.fork-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  width: 100%;
}

.fork-label {
  font-size: 12px;
  color: var(--text-secondary);
  letter-spacing: 6px;
  font-weight: 500;
}

/* Era desc */
.era-desc {
  font-size: 18px;
  color: var(--text-main);
  text-align: center;
  padding: 13px 14px;
  background: rgba(180, 160, 120, 0.13);
  border-left: 3px solid var(--accent-gold);
  font-weight: 500;
  line-height: 1.5;
}

/* Observation */
.observation {
  background: rgba(180, 160, 120, 0.09);
  border-left: 4px solid var(--accent-gold);
  padding: 18px 28px;
  display: flex;
  align-items: center;
  gap: 22px;
}

.obs-label {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent-gold);
  letter-spacing: 4px;
  white-space: nowrap;
}

.obs-divider {
  width: 1px;
  height: 32px;
  background: var(--accent-gold);
  opacity: 0.4;
  flex-shrink: 0;
}

.obs-content {
  font-size: 17px;
  color: var(--text-main);
  line-height: 1.6;
}

.obs-highlight {
  color: var(--accent-gold);
  font-weight: 600;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">

    <div class="hook-row">
      <div class="hook-line"></div>
      <div class="hook">"Talk is expensive, show me the skills."</div>
      <div class="hook-line"></div>
    </div>

    <div class="title-block">
      <div class="title">引子：从 Talk &amp; Search 到 Agent &amp; Decide</div>
      <div class="subtitle"><span>两 个 时 代 的 分 叉</span></div>
    </div>

    <div class="columns">
      <div class="col col-left">
        <div class="era-tag">LLM 时代</div>
        <div class="era-title">Talk &amp; Search</div>
        <div class="era-chinese">对话与检索</div>
        <div class="visual">
          <div class="bubble bubble-lg"></div>
          <div class="bubble bubble-md"></div>
          <div class="bubble bubble-sm"></div>
          <div class="speech-dots">
            <div class="speech-dot"></div>
            <div class="speech-dot"></div>
            <div class="speech-dot"></div>
          </div>
        </div>
        <div class="era-desc">
          <span>人类提问，模型回答</span>
        </div>
      </div>

      <div class="col col-middle">
        <div class="fork-line-top"></div>
        <div class="fork-content">
          <svg width="160" height="120" viewBox="0 0 160 120" style="display:block;">
            <line x1="12" y1="60" x2="70" y2="60" stroke="#B4A078" stroke-width="3"/>
            <circle cx="12" cy="60" r="7" fill="#B4A078"/>
            <line x1="70" y1="60" x2="130" y2="22" stroke="#B4A078" stroke-width="3"/>
            <line x1="70" y1="60" x2="130" y2="98" stroke="#B4A078" stroke-width="3"/>
            <circle cx="70" cy="60" r="6" fill="#B4A078"/>
            <polyline points="118,12 135,22 122,34" fill="none" stroke="#B4A078" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
            <polyline points="118,108 135,98 122,86" fill="none" stroke="#B4A078" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
          <div class="fork-label"><span>FORK</span></div>
        </div>
        <div class="fork-line-bottom"></div>
      </div>

      <div class="col col-right">
        <div class="era-tag">Agentic 时代</div>
        <div class="era-title">Agent &amp; Decide</div>
        <div class="era-chinese">代理与决断</div>
        <div class="visual">
          <div class="block block-lg"></div>
          <div class="block block-md">
            <span class="checkmark">✓</span>
          </div>
          <div class="block block-sm"></div>
        </div>
        <div class="era-desc">
          <span>agent 自主执行，人类验收结果</span>
        </div>
      </div>
    </div>

    <div class="observation">
      <div class="obs-label"><span>本次观察</span></div>
      <div class="obs-divider"></div>
      <div class="obs-content">
        通过 <span class="obs-highlight">Hermes Agent 仓库</span> 这个微观透镜，寻找人类心智函数正在发生<span class="obs-highlight">微小但不可逆的分叉</span>的证据。
      </div>
    </div>

  </div>
</div>
</body>
</html>
