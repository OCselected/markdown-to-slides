

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>第二幕 · Hermes 技术架构</title>
<script src="../assets/echarts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

:root {
  --bg: #0F1E33;
  --bg-deep: #0A1526;
  --primary: #1B3B6B;
  --accent: #B4A078;
  --text: #F5F0E8;
  --text-soft: rgba(245, 240, 232, 0.68);
  --text-faint: rgba(245, 240, 232, 0.42);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--text);
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: var(--bg);
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: radial-gradient(ellipse at 50% 40%, #142844 0%, #0F1E33 55%, #0A1526 100%);
}

.bg-texture {
  position: absolute;
  inset: 0;
  opacity: 0.06;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(180,160,120,0.4) 0, transparent 2px),
    radial-gradient(circle at 80% 70%, rgba(245,240,232,0.3) 0, transparent 2px),
    radial-gradient(circle at 50% 50%, rgba(180,160,120,0.3) 0, transparent 1px);
  background-size: 80px 80px, 120px 120px, 40px 40px;
}

.bauhaus-square {
  position: absolute;
  width: 220px;
  height: 220px;
  top: -60px;
  right: -60px;
  border: 1.5px solid rgba(180, 160, 120, 0.25);
}

.bauhaus-circle {
  position: absolute;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  bottom: -140px;
  left: -120px;
  border: 1.5px solid rgba(245, 240, 232, 0.10);
}

.bauhaus-inner-circle {
  position: absolute;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  top: 140px;
  left: 140px;
  background: rgba(180, 160, 120, 0.18);
}

.bauhaus-line-h {
  position: absolute;
  left: 60px;
  top: 140px;
  width: 80px;
  height: 1.5px;
  background: var(--accent);
  opacity: 0.7;
}

.bauhaus-dot {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  top: 136px;
  left: 148px;
}

.bauhaus-square-tr {
  position: absolute;
  width: 60px;
  height: 60px;
  bottom: 80px;
  right: 80px;
  border: 1.5px solid var(--accent);
  opacity: 0.7;
}

.bauhaus-line-v {
  position: absolute;
  bottom: 80px;
  right: 160px;
  width: 1.5px;
  height: 60px;
  background: var(--accent);
  opacity: 0.55;
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.chapter-mark {
  position: absolute;
  top: 60px;
  left: 60px;
  display: flex;
  align-items: center;
  gap: 14px;
  z-index: 3;
}

.chapter-num {
  font-family: 'Noto Serif SC', serif;
  font-size: 42px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 2px;
  line-height: 1;
}

.chapter-label {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  color: var(--accent);
  letter-spacing: 6px;
  font-weight: 500;
  opacity: 0.85;
}

.chapter-label-sub {
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: rgba(180,160,120,0.6);
  letter-spacing: 4px;
  font-style: italic;
  margin-top: 4px;
}

.act-roman {
  position: absolute;
  top: 62px;
  right: 60px;
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 8px;
  opacity: 0.8;
  font-style: italic;
  z-index: 3;
}

.hero {
  margin-top: 100px;
  text-align: center;
  position: relative;
  z-index: 2;
}

.act-eyebrow {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 12px;
  margin-bottom: 22px;
  font-weight: 500;
  opacity: 0.9;
}

.hero-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 84px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 6px;
  line-height: 1.1;
  text-shadow: 0 2px 20px rgba(0,0,0,0.3);
}

.hero-title .dot {
  color: var(--accent);
  margin: 0 12px;
  font-weight: 400;
}

.hero-title .en {
  font-family: 'Noto Serif SC', serif;
  font-weight: 500;
  font-style: italic;
  color: var(--text);
}

.hero-sub {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 22px;
  font-weight: 300;
  color: rgba(245, 240, 232, 0.72);
  letter-spacing: 4px;
  margin-top: 24px;
}

.two-lines {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin-top: 34px;
  position: relative;
  z-index: 2;
}

.two-lines::before, .two-lines::after {
  content: '';
  position: absolute;
  top: -8px;
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
}
.two-lines::before { left: calc(50% - 14px); }
.two-lines::after { left: calc(50% + 8px); }

.v-line {
  width: 2px;
  height: 160px;
  background: linear-gradient(to bottom, transparent 0%, var(--text) 20%, var(--text) 80%, transparent 100%);
  opacity: 0.85;
}

.invariant-labels {
  display: flex;
  justify-content: center;
  gap: 140px;
  margin-top: 12px;
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 6px;
  opacity: 0.75;
  font-style: italic;
}

.guiding {
  margin-top: 36px;
  text-align: center;
  max-width: 1100px;
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 400;
  color: rgba(245, 240, 232, 0.68);
  line-height: 1.85;
  letter-spacing: 2px;
  position: relative;
  z-index: 2;
}

.guiding .em {
  color: var(--accent);
  font-weight: 500;
}

.two-cols {
  display: flex;
  gap: 80px;
  margin-top: 40px;
  width: 100%;
  max-width: 1180px;
  justify-content: center;
  position: relative;
  z-index: 2;
}

.col {
  flex: 1;
  max-width: 460px;
  padding: 24px 32px;
  border-top: 1.5px solid rgba(180,160,120,0.55);
  position: relative;
}

.col-num {
  position: absolute;
  top: -12px;
  left: 32px;
  background: var(--bg);
  padding: 0 10px;
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 4px;
  font-style: italic;
}

.col-title {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  color: var(--accent);
  letter-spacing: 8px;
  font-weight: 500;
  margin-bottom: 12px;
}

.col-detail {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  color: var(--text);
  line-height: 1.75;
  font-weight: 400;
  letter-spacing: 1px;
}

.footer {
  position: absolute;
  bottom: 40px;
  left: 0;
  right: 0;
  text-align: center;
  z-index: 2;
}

.footer-line {
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: rgba(245, 240, 232, 0.42);
  letter-spacing: 8px;
  font-style: italic;
}

.footer-mark {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  margin-top: 10px;
}

.footer-mark .mini-line {
  width: 40px;
  height: 1px;
  background: rgba(180,160,120,0.4);
}

.footer-mark .mini-text {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 10px;
  color: rgba(180,160,120,0.6);
  letter-spacing: 5px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="bg-texture"></div>
    <div class="bauhaus-square"></div>
    <div class="bauhaus-circle"></div>
    <div class="bauhaus-inner-circle"></div>
    <div class="bauhaus-square-tr"></div>
    <div class="bauhaus-line-v"></div>
    <div class="bauhaus-line-h"></div>
    <div class="bauhaus-dot"></div>
  </div>

  <div id="ct">
    <div class="chapter-mark">
      <div class="chapter-num"><span>02</span></div>
      <div>
        <div class="chapter-label"><span>CHAPTER</span></div>
        <div class="chapter-label-sub"><span>SECOND ACT</span></div>
      </div>
    </div>

    <div class="act-roman"><span>ACT &nbsp; II</span></div>

    <div class="hero">
      <div class="act-eyebrow"><span>第 &nbsp; 二 &nbsp; 幕</span></div>
      <h1 class="hero-title">
        <span>第二幕</span><span class="dot">·</span><span class="en">Hermes 技术架构</span>
      </h1>
      <div class="hero-sub"><span>两条不变量决定了所有设计决策</span></div>
    </div>

    <div class="two-lines">
      <div class="v-line"></div>
      <div class="v-line"></div>
    </div>

    <div class="invariant-labels">
      <span>IN VARIANS &nbsp; I</span>
      <span>IN VARIANS &nbsp; II</span>
    </div>

    <div class="guiding">
      <span>Hermes 的几乎所有设计决策都从</span><span class="em">两条不变量</span><span>推出来——理解不变量，才能理解为什么 Hermes 是这个样子。</span>
    </div>

    <div class="two-cols">
      <div class="col">
        <div class="col-num"><span>I.</span></div>
        <div class="col-title"><span>目 标 · GOAL</span></div>
        <div class="col-detail"><span>先讲不变量，再讲架构，最后讲独特性——从根因出发，层层展开。</span></div>
      </div>
      <div class="col">
        <div class="col-num"><span>II.</span></div>
        <div class="col-title"><span>方 法 · METHOD</span></div>
        <div class="col-detail"><span>从设计原则推导出能力落地路径——让每个能力都能回溯到不变量。</span></div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-line"><span>理解不变量，方能读懂 Hermes</span></div>
      <div class="footer-mark">
        <span class="mini-line"></span>
        <span class="mini-text"><span>HERMES &nbsp; · &nbsp; ARCHITECTURE</span></span>
        <span class="mini-line"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
