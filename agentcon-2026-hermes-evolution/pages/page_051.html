

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>致谢 · Thank you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0F1E33;
  --bg-deep: #0A1526;
  --primary: #1B3B6B;
  --accent: #B4A078;
  --text: #F5F0E8;
  --muted: rgba(245,240,232,0.68);
  --muted-strong: rgba(245,240,232,0.88);
  --line: rgba(180,160,120,0.55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--bg);
}

.bg-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 90% 60% at 50% 38%, rgba(27,59,107,0.44) 0%, transparent 70%);
}

.bg-corner {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 110% 55% at 50% 110%, rgba(10,21,38,0.72) 0%, transparent 70%);
}

.bg-texture {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(245,240,232,0.013) 0 1px, transparent 1px 3px);
}

.bg-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 92% 72% at 50% 50%, transparent 42%, rgba(0,0,0,0.42) 100%);
}

.corner {
  position: absolute;
  width: 44px;
  height: 44px;
  border: 0 solid var(--line);
  opacity: 0.5;
}
.corner.tl { top: 56px; left: 72px; border-top-width: 1px; border-left-width: 1px; }
.corner.tr { top: 56px; right: 72px; border-top-width: 1px; border-right-width: 1px; }
.corner.bl { bottom: 92px; left: 72px; border-bottom-width: 1px; border-left-width: 1px; }
.corner.br { bottom: 92px; right: 72px; border-bottom-width: 1px; border-right-width: 1px; }

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.top-mark {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 46px;
}
.top-mark .line {
  width: 108px;
  height: 1px;
  background: var(--line);
}
.top-mark .dot {
  width: 7px;
  height: 7px;
  background: var(--accent);
  transform: rotate(45deg);
}

.title {
  font-family: 'Noto Serif SC', serif;
  font-size: 96px;
  letter-spacing: 0.05em;
  line-height: 1.02;
  color: var(--text);
  text-align: center;
  margin-bottom: 22px;
  white-space: nowrap;
}

.title .zh {
  font-weight: 600;
}

.title .divider {
  color: var(--accent);
  font-weight: 300;
  font-size: 0.5em;
  margin: 0 0.36em;
  vertical-align: 0.28em;
}

.title .en {
  font-style: italic;
  font-weight: 400;
  color: var(--muted-strong);
  letter-spacing: 0.02em;
}

.subtitle {
  font-family: 'Noto Serif SC', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 26px;
  letter-spacing: 0.44em;
  color: var(--accent);
  text-align: center;
  margin-bottom: 58px;
  padding-left: 0.44em;
}

.mid-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  max-width: 1200px;
}

.rule {
  width: 44px;
  height: 1px;
  background: var(--line);
}

.line-1, .line-2, .line-3 {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 19px;
  font-weight: 300;
  line-height: 1.9;
  color: var(--muted-strong);
  text-align: center;
  letter-spacing: 0.04em;
}

.accent-serif {
  color: var(--accent);
  font-family: 'Noto Serif SC', serif;
  font-weight: 500;
  font-style: italic;
  font-size: 20px;
}

.accent-inline {
  color: var(--accent);
  font-family: 'Noto Serif SC', serif;
  font-style: italic;
  font-weight: 500;
}

.date {
  color: var(--accent);
  font-family: 'Noto Serif SC', serif;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.12em;
  font-weight: 500;
}

.bottom-mark {
  display: flex;
  justify-content: center;
  margin-top: 42px;
}
.bottom-mark .sq {
  width: 6px;
  height: 6px;
  border: 1px solid var(--accent);
  transform: rotate(45deg);
}

.footer {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 0.32em;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
  padding-left: 0.32em;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="bg-glow"></div>
    <div class="bg-corner"></div>
    <div class="bg-texture"></div>
    <div class="bg-vignette"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>
  <div id="ct">
    <div class="top-mark">
      <span class="line"></span>
      <span class="dot"></span>
      <span class="line"></span>
    </div>

    <h1 class="title">
      <span class="zh">致</span><span class="zh">谢</span><span class="divider">·</span><span class="en">Thank you</span>
    </h1>

    <div class="subtitle"><span>Keep Movement</span></div>

    <div class="mid-block">
      <div class="rule"></div>
      <p class="line-1"><span>「</span><span class="accent-serif">开源之道</span><span>」 · </span><span class="accent-serif">适兕</span><span> × </span><span class="accent-serif">窄廊</span><span>，两种存在形式，一个使命</span></p>
      <p class="line-1"><span class="accent-inline">Keep Movement</span><span> —— 知识不是静止的，是在移动中产生的。</span></p>

      <div class="rule"></div>

      <p class="line-2"><span>数据基线 </span><span class="date">2026-09-11</span><span> · 田野考察 —— 从群众中来，非框架先行。</span></p>

      <div class="rule"></div>

      <p class="line-3"><span>这个演讲不是要证明什么，</span><span class="accent-inline">是要打开一种思考</span><span>。</span></p>
    </div>

    <div class="bottom-mark">
      <span class="sq"></span>
    </div>
  </div>

  <div class="footer"><span>2026-09-14 · AgentCon 2026 · 北京 · Token 经济趋势</span></div>
</div>
</body>
</html>
